<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F4FA">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="DARKWIZ Construction Toolkit (DARKWIZ CT): estimating, project control and procurement for construction.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DARKWIZ CT">
<meta name="app-version" content="1.2.0+84b81db">
<title>DARKWIZ Construction Toolkit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --ground:#F3F4FA; --surface:#FFFFFF; --sunk:#F7F8FC; --raise:#EEF0F8; --ink:#141733; --muted:#525A80; --faint:#868CAD;
  --rule:#DDE0EE; --rule-strong:#C3C8DE; --accent:#5B3FE0; --accent-ink:#FFFFFF; --accent-soft:#ECE8FE; --cyan:#0E8AA3; --cyan-soft:#E0F4F8;
  --s1:#0E9AB5; --s2:#6A4BEF; --s3:#D43F86;
  --ok:#1F8A55; --ok-soft:#E1F4EA; --warn:#9A6300; --warn-soft:#FDF1D8; --bad:#C0342B; --bad-soft:#FCE5E3;
  --clock:#3B2BB8; --clock-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(20,23,51,.06),0 4px 16px rgba(20,23,51,.05);
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
:root.night{
  color-scheme:dark;
  --ground:#0B0E1F; --surface:#131735; --sunk:#0F1330; --raise:#1A1F45; --ink:#E8EAF8; --muted:#A0A7CC; --faint:#6E7599;
  --rule:#252B55; --rule-strong:#343B6B; --accent:#8F75FF; --accent-ink:#0B0E1F; --accent-soft:#231F4F; --cyan:#22D3EE; --cyan-soft:#10303F;
  --s1:#16A6C0; --s2:#8F75FF; --s3:#E8559A;
  --ok:#4CC98A; --ok-soft:#12302A; --warn:#E8B04E; --warn-soft:#2D2616; --bad:#FF7A70; --bad-soft:#35191F;
  --clock:#2A2470; --clock-ink:#E8EAF8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}

/* ---------- login ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding-block:40px;padding-inline:16px;background:
  radial-gradient(60% 50% at 20% 10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%),
  radial-gradient(50% 40% at 90% 90%,color-mix(in srgb,var(--cyan) 14%,transparent),transparent 70%),var(--ground)}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:32px 28px;box-shadow:var(--shadow);display:grid;gap:18px;text-align:center}
.logo{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em}
.logo span{color:var(--accent)}
.gate-card .who{display:flex;align-items:center;gap:12px;justify-content:center;padding:10px;border:1px solid var(--rule);border-radius:10px;background:var(--sunk)}
.gate-card .who img{width:36px;height:36px;border-radius:50%}
.gate-card .who b{display:block;text-align:left}
.gate-card .who small{display:block;text-align:left;color:var(--muted);font-size:12px}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.top-in{max-width:1560px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;padding-inline:20px}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.05em;white-space:nowrap}
.brand span{color:var(--accent)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button,.rail .rbtn{border:1px solid var(--rule-strong);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap}
.rail .rbtn{white-space:normal;line-height:1.3;min-width:0}
.rail{min-width:0}
.nav button:hover,.rail .rbtn:hover{border-color:var(--accent);color:var(--accent)}
.nav button[aria-current="true"],.rail .rbtn[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.me img{width:28px;height:28px;border-radius:50%}
.mode{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--rule-strong)}
.mode.cloud{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.mode.local{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.shell{max-width:1560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 236px;gap:18px;padding-block:18px 48px;padding-inline:20px}
main{min-width:0}
.rail{display:grid;gap:10px;align-content:start;position:sticky;top:74px}
.rail .rbtn{text-align:center;padding:10px 12px;font-weight:600}
.clock{background:var(--clock);color:var(--clock-ink);border-radius:var(--r);padding:14px 16px;text-align:center}
.clock .t{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.clock .d{font-size:13px;opacity:.85}
.clock .z{font-family:var(--mono);font-size:10.5px;opacity:.65;margin-top:4px}

/* ---------- common blocks ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:end;gap:8px 16px;margin-bottom:14px}
.page-head h1{font-size:24px;line-height:1.2}
.page-head p{margin:0;color:var(--muted);flex:0 0 100%;max-width:none;text-wrap:pretty}
.page-head .spacer{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dash{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.box>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.box>header h2{font-size:15px;font-weight:600}
.box>header .sp{flex:1}
.box>.bd{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.box.soon{display:grid;place-items:center;min-height:160px;border-style:dashed;box-shadow:none;background:transparent;color:var(--faint);text-align:center;padding:20px}
.box.soon b{display:block;font-family:var(--display);font-size:15px;color:var(--muted)}
.eyebrow{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.btn{border:1px solid var(--rule-strong);background:var(--surface);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--sunk);min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.25;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .v small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);margin-left:4px}
.kpi .s{font-size:11.5px;color:var(--faint)}
.chip{font-family:var(--mono);font-size:11px;padding:1px 8px;border-radius:999px;white-space:nowrap;display:inline-block;background:var(--raise);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.cy{background:var(--cyan-soft);color:var(--cyan)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--rule-strong);border-radius:8px}
.msg{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13px}
.msg.warn{border-color:var(--warn);background:var(--warn-soft)}
.msg.bad{border-color:var(--bad);background:var(--bad-soft)}
.list-links{margin:0;padding:0;list-style:none;display:grid;gap:2px;counter-reset:n}
.list-links li{counter-increment:n}
.list-links button{width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.list-links button::before{content:counter(n) ".";font-family:var(--mono);font-size:11.5px;color:var(--faint);width:18px;flex:none}
.list-links button:hover{background:var(--raise)}
.list-links .v{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;max-width:100%}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.t th{font-weight:500;font-size:11.5px;color:var(--muted);text-align:left;padding:7px 8px;background:var(--sunk);border-bottom:1px solid var(--rule);white-space:nowrap;position:sticky;top:0}
.t td{padding:6px 8px;border-bottom:1px solid var(--rule);font-size:13px;vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.n,.t th.n{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.t tr.tot td{font-weight:600;background:var(--sunk);border-top:1px solid var(--rule-strong)}
.t tr.grp td{background:var(--raise);font-family:var(--display);font-weight:600;font-size:12.5px}
.t tr.crit td:first-child{box-shadow:inset 3px 0 var(--s3)}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--raise)}
.t .acts{white-space:nowrap;text-align:right}
/* editable grid */
.eg td{padding:0}
.eg td.ro{padding:6px 8px}
.eg input,.eg select{border:0;background:transparent;padding:6px 8px;width:100%;min-width:60px;font-family:var(--mono);font-size:12.5px}
.eg select{min-width:112px}
.eg input[type=date]{min-width:128px}
.eg input[type=text].w{min-width:220px;font-family:var(--body);font-size:13px}
.eg input:focus,.eg select:focus{background:var(--accent-soft);outline:none}
.eg td.x button{border:0;background:none;color:var(--faint);cursor:pointer;padding:6px 8px;font-size:15px}
.eg td.x button:hover{color:var(--bad)}
.eg td.n input{text-align:right}

/* forms */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.f{display:grid;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--rule-strong);background:var(--sunk);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.f textarea{min-height:72px;resize:vertical}
.f.chk{display:flex;align-items:center;gap:8px;padding-top:18px}
.f.chk input{width:auto;accent-color:var(--accent)}
.search{border:1px solid var(--rule-strong);background:var(--sunk);border-radius:7px;padding:6px 10px;min-width:0}
select.search{padding:5px 8px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,10,25,.55);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);border:1px solid var(--rule);border-radius:14px;width:min(680px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal>header{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.modal>header h3{font-size:16px;flex:1}
.modal>.mb{padding:16px 18px;overflow:auto;display:grid;gap:14px}
.modal>footer{padding:12px 18px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:13px;z-index:200;box-shadow:var(--shadow)}

/* charts */
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--rule-strong);border-radius:6px;padding:6px 9px;font-size:12px;font-family:var(--mono);box-shadow:var(--shadow);white-space:nowrap;z-index:5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.legend i.ln{height:3px;vertical-align:3px}
.gantt-wrap{overflow:auto;border:1px solid var(--rule);border-radius:8px;max-height:620px}
.gantt-wrap svg{display:block}
.meter{height:8px;border-radius:4px;background:var(--raise);overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--s1)}
.meter b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dow{font-size:11px;color:var(--faint);text-align:center;padding:2px 0;font-family:var(--mono)}
.cal button{border:1px solid var(--rule);background:var(--sunk);border-radius:6px;min-height:46px;padding:3px 4px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal button.out{opacity:.4}
.cal button.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal button.sel{background:var(--accent-soft)}
.cal button .dn{font-family:var(--mono);font-size:11.5px}
.cal button.hol .dn{color:var(--bad);font-weight:600}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap}
.cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--s2)}
.cal .dots i.h{background:var(--bad)} .cal .dots i.d{background:var(--warn)} .cal .dots i.r{background:var(--s1)} .cal .dots i.p{background:var(--s3)}
.evlist{display:grid;gap:4px;max-height:180px;overflow:auto}
.ev{display:flex;gap:8px;align-items:baseline;font-size:12.5px;padding:3px 0;border-bottom:1px dotted var(--rule)}
.ev .dt{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.ev .tt{flex:1;min-width:0}
.todo{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dotted var(--rule);font-size:13px}
.todo input[type=checkbox]{accent-color:var(--accent);margin-top:3px}
.todo.done .tx{text-decoration:line-through;color:var(--faint)}
.todo .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.todo .due{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.todo .due.late{color:var(--bad)}
.note{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sunk);cursor:pointer;display:grid;gap:2px}
.note:hover{border-color:var(--accent)}
.note b{font-size:13px}
.note p{margin:0;font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kcol{background:var(--sunk);border:1px solid var(--rule);border-radius:8px;padding:8px;display:grid;gap:6px;align-content:start;min-height:120px}
.kcol h4{margin:0;font-family:var(--display);font-size:12.5px;display:flex;justify-content:space-between}
.kcard{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;font-size:12.5px;cursor:pointer;display:grid;gap:2px}
.kcard:hover{border-color:var(--accent)}
.kcard small{color:var(--muted);font-family:var(--mono);font-size:11px}
.plist{display:grid;gap:8px}
.pcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left}
.pcard:hover{border-color:var(--accent)}
.pcard b{font-family:var(--display);font-size:15px}
.pcard .meta{font-size:12px;color:var(--muted)}
.overview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.conv{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.conv .row>input,.conv .row>output{min-width:80px}
.conv .row>select{flex:0 1 auto;max-width:55%}
.conv .eq{padding-bottom:8px;color:var(--faint);font-family:var(--mono)}
.refcard{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;display:grid;gap:6px;background:var(--sunk)}
.refcard h4{margin:0;font-family:var(--display);font-size:13.5px}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.chkgrid label{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;cursor:pointer}
.chkgrid input{accent-color:var(--accent);margin-top:3px}
.chkgrid small{display:block;color:var(--muted);font-size:11.5px}

@media (max-width:1180px){.dash{grid-template-columns:minmax(0,1fr)}}
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));order:-1}
  .clock{grid-column:1/-1;display:flex;align-items:baseline;justify-content:center;gap:12px;padding:8px 12px}
  .clock .t{font-size:20px}
  .overview,.grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .kanban{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .top-in{padding-inline:16px;flex-wrap:wrap}
  .nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}
  .shell{padding-inline:16px}
  .me span.nm{display:none}
  .kanban{grid-template-columns:minmax(0,1fr)}
  .conv{grid-template-columns:minmax(0,1fr)}
  .conv .eq{display:none}
}

/* brand, version, footer */
.brand{display:flex;align-items:center;gap:9px}
.brand .logo-mark{flex:none;display:block}
.gate-logo{display:flex;justify-content:center;margin-bottom:-6px}

/* ================= local fallback DB (same surface as the cloud db) ================= */
function makeLocalDB() {
  const KEY = 'dwqs.localdb.v1';
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { data = {}; }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { } };

/* ================= toast & modal ================= */

'use strict';
const SHEETS = ['schedule', 'boq', 'billing', 'progress', 'costs'];
const ARR = { schedule: 'activities', boq: 'items', billing: 'items', progress: 'records', costs: 'entries' };
const blankSheet = n => ({ schedule: { calendar: S.settings.calendar, skipHolidays: true, activities: [] }, boq: { items: [] }, billing: { items: [] }, progress: { records: [] }, costs: { entries: [] } }[n]);
const projectOf = pid => S.projects.find(p => p.id === pid);
const sheetPath = (pid, n) => `projects/${pid}/sheets/${n}`;

function openProject(pid) {
  if (S.open && S.open.pid === pid) return;
  closeProject();
  const o = S.open = { pid, sheets: {}, loaded: {}, unsub: [], summaryDone: false };
  SHEETS.forEach(n => {
    const path = sheetPath(pid, n);
    o.unsub.push(S.db.doc(path).onSnapshot(snap => {
      if (S.open !== o) return;
      const q = WQ[path]; if (q && (q.pending || q.running)) return; // local edits win until saved
      o.sheets[n] = snap.exists ? deepClone(snap.data()) : blankSheet(n);
      o.loaded[n] = true;
      if (SHEETS.every(k => o.loaded[k]) && !o.summaryDone) { o.summaryDone = true; refreshSummary(); }
      scheduleRender();
    }, err => { console.error(err); toast(dbErrText(err)); }));
  });
}
function closeProject() { if (!S.open) return; S.open.unsub.forEach(u => u()); S.open = null; }
const sheetsReady = () => S.open && SHEETS.every(k => S.open.loaded[k]);
function editSheet(n, fn, render = true) {
  const o = S.open; if (!o) return;
  fn(o.sheets[n]);
  const path = sheetPath(o.pid, n), snap = o.sheets[n];
  queueSet(path, () => deepClone(snap));
  refreshSummarySoon();
  if (render) scheduleRender(true);
}
const refreshSummarySoon = debounce(() => refreshSummary(), 1500);
function refreshSummary() {
  const o = S.open; if (!o || !sheetsReady()) return;
  const p = projectOf(o.pid); if (!p) return;
  const summary = buildSummary(p, o.sheets);
  const strip = x => JSON.stringify({ ...(x || {}), at: 0 });
  if (p.summary && strip(p.summary) === strip(summary)) return; // write only on change
  saveProjectFields(p.id, { summary });
}
function saveProjectFields(pid, fields) {
  const p = projectOf(pid); if (!p) return;
  Object.assign(p, fields);
  const path = `projects/${pid}`;
  queueSet(path, () => { const cur = projectOf(pid) || p; const b = { ...cur }; delete b.id; return b; }, 300);
}

  ${!S.loaded.projects ? '<div class="empty">Loading projects…</div>' : list.length ? `<div class="plist">${list.map(p => { const s = p.summary || {}; return `<button class="pcard" data-act="go" data-page="open" data-a="${p.id}" data-b="overview"><div><b>${esc(p.name)}</b><div class="meta">${esc(p.code || '')} · ${esc(p.ownerName || '')} · ${esc(p.location || '')}</div></div><div style="text-align:right"><span class="chip ${p.status === 'Ongoing' ? 'acc' : p.status === 'Completed' ? 'ok' : ''}">${esc(p.status || '')}</span><div class="meta num">${money(num(p.contract) + num(p.vo), 0)}</div></div><div style="grid-column:1/-1"><div class="meter" title="Actual ${pct(s.actual)} vs planned ${pct(s.planned)}"><i style="width:${clamp(num(s.actual), 0, 100)}%"></i><b style="left:${clamp(num(s.planned), 0, 100)}%"></b></div><div class="meta" style="margin-top:4px">Actual ${pct(s.actual)} · planned ${pct(s.planned)} · ${fdate(s.start || p.start)} → ${fdate(s.finish || p.targetEnd)}</div></div></button>`; }).join('')}</div>` : `<div class="empty">${S.projects.length ? 'No projects match.' : 'No projects yet.'} <button class="btn pri" data-act="go" data-page="new">Create a project</button></div>`}`;
}

const PTAB = {};
/* ---------- overview: the four boxes ---------- */

    <div class="kpi"><div class="l">Cost performance</div><div class="v">${e.CPI ? fmt(e.CPI, 2) : '—'}<small>CPI</small></div><div class="s">SPI ${e.SPI ? fmt(e.SPI, 2) : '—'} · margin ${pct(e.marginPct)}</div></div>
  </div>
  <div class="overview">
    <section class="box"><header><h2>Project management details</h2></header><div class="bd"><ul class="list-links">
      ${li('schedule', 'PERT / CPM', `${c.acts.length} activities · ${c.acts.filter(a => a.crit).length} critical`)}

    </ul>${partsBar([{ name: 'Materials', color: 'var(--s1)', val: b.cat.M }, { name: 'Labour', color: 'var(--s2)', val: b.cat.L }, { name: 'Equipment', color: 'var(--s3)', val: b.cat.E }, { name: 'Lump sum / subcon', color: 'var(--faint)', val: b.cat.O }])}</div></section>
    <section class="box"><header><h2>Project details</h2></header><div class="bd"><ul class="list-links">
      ${li('details', 'Project name', esc(p.name))}

      ${li('details', 'PO #', esc(p.po || '—'))}
      ${li('details', 'Contracts and specifications', `${(p.contracts || []).length} documents`)}
      ${li('details', 'Other negotiations between parties', `${(p.negotiations || []).length} entries`)}

    <section class="box"><header><h2>Plan vs actual details</h2></header><div class="bd"><ul class="list-links">

  </div>`;

/* ---------- schedule (PERT/CPM) ---------- */
PTAB.schedule = p => {
  const sh = S.open.sheets.schedule, c = cpm(sh, p);
  const cols = [['code', 'Code', 't', 60], ['name', 'Activity', 'w'], ['a', 'Optimistic a', 'n'], ['m', 'Most likely m', 'n'], ['b', 'Pessimistic b', 'n'], ['preds', 'Predecessors', 't'], ['cost', 'Budget / weight', 'n'], ['pct', '% done', 'n']];
  const cell = (a, [k, , t]) => `<td class="${t === 'n' ? 'n' : ''}"><input id="schedule-${a.id}-${k}" data-sheet="schedule" data-row="${a.id}" data-field="${k}" data-num="${t === 'n' ? 1 : ''}" type="text" class="${t === 'w' ? 'w' : ''}" value="${esc(a[k] ?? '')}" ${t === 'n' ? 'inputmode="decimal"' : ''} aria-label="${k}"${k === 'code' ? ' style="min-width:56px;text-transform:uppercase"' : ''}${k === 'preds' ? ' placeholder="e.g. A, B+2"' : ''}></td>`;
  const rows = sh.activities.map((a, i) => { const x = c.byCode?.[String(a.code || '').toUpperCase()] || {}; return `<tr class="${x.crit ? 'crit' : ''}">${cols.map(cc => cell(a, cc)).join('')}<td class="n ro">${fmt(x.te, 2)}</td><td class="n ro">${fmt(x.ES, 1)}</td><td class="n ro">${fmt(x.EF, 1)}</td><td class="n ro">${fmt(x.LS, 1)}</td><td class="n ro">${fmt(x.LF, 1)}</td><td class="n ro">${x.crit ? '<span class="chip bad">0</span>' : fmt(x.TF, 1)}</td><td class="ro num" style="white-space:nowrap">${fdate(x.sd)}</td><td class="ro num" style="white-space:nowrap">${fdate(x.fd)}</td><td class="x"><button data-act="rowMove" data-sheet="schedule" data-row="${a.id}" data-dir="-1" aria-label="Move up">↑</button></td><td class="x"><button data-act="rowDel" data-sheet="schedule" data-row="${a.id}" aria-label="Delete activity">×</button></td></tr>`; }).join('');
  const target = p.targetEnd;
  const probDate = S.ui.probDate || target || c.finish;
  const k = c.ok ? c.dayIndex(probDate) : 0, z = c.sigma > 0 ? (k - c.D) / c.sigma : null, prob = c.sigma > 0 ? normCdf(z) : (k >= c.D ? 1 : 0);
  return `<div class="grid2" style="margin-bottom:14px">
    <section class="box"><header><h2>Project scheduling</h2></header><div class="bd"><div class="fields">
      <div class="f"><label for="sc-cal">Working calendar</label><select id="sc-cal" data-sheet="schedule" data-field="calendar"><option value="work6"${sh.calendar === 'work6' ? ' selected' : ''}>Mon–Sat (6-day week)</option><option value="work5"${sh.calendar === 'work5' ? ' selected' : ''}>Mon–Fri (5-day week)</option><option value="calendar"${sh.calendar === 'calendar' ? ' selected' : ''}>Calendar days</option></select></div>
      <div class="f chk"><input type="checkbox" id="sc-hol" data-sheet="schedule" data-field="skipHolidays" ${sh.skipHolidays !== false ? 'checked' : ''}><label for="sc-hol" style="color:var(--ink);font-size:13px">Skip ${esc(S.settings.holidayRegion)} holidays</label></div>
      <div class="f"><label>Project start</label><div class="num" style="padding:7px 0">${fdate(p.start)} <button class="btn sm" data-act="ptab" data-tab="details">Change</button></div></div>
    </div><div class="row">${sh.activities.length ? '' : '<button class="btn" data-act="loadSchedTpl">Load 2-storey building template</button>'}<button class="btn" data-act="saveBaseline">${sh.baseline ? 'Update' : 'Save'} schedule baseline</button>${sh.baseline ? `<span class="faint" style="font-size:12px">Baseline saved ${fdate(sh.baseline.savedAt?.slice(0, 10))}</span>` : ''}</div></div></section>
    <section class="box"><header><h2>Project duration</h2></header><div class="bd">
      <div class="kpis"><div class="kpi"><div class="l">Expected duration Te</div><div class="v">${fmt(c.D, 1)}<small>days</small></div><div class="s">σ = ${fmt(c.sigma, 2)} days</div></div><div class="kpi"><div class="l">Finish</div><div class="v" style="font-size:16px">${fdate(c.finish)}</div><div class="s">${target ? `target ${fdate(target)}` : 'no target date set'}</div></div></div>
      <div class="row"><label for="probDate" class="muted" style="font-size:12.5px">Probability of finishing by</label><input type="date" id="probDate" class="search" data-ui="probDate" value="${esc(probDate)}"><b class="num">${c.ok ? pct(prob * 100, 1) : '—'}</b>${z != null ? `<span class="faint num" style="font-size:12px">z = ${fmt(z, 2)}</span>` : ''}</div>
      <div style="font-size:12.5px"><span class="muted">Critical path:</span> <span class="num">${c.cp.length ? c.cp.map(esc).join(' → ') : '—'}</span></div>
    </div></section></div>
  ${c.errors.length ? `<div class="msg bad" style="margin-bottom:12px">${c.errors.map(esc).join('<br>')}</div>` : ''}
  <section class="box"><header><h2>PERT / CPM activities</h2><span class="sp"></span><span class="faint" style="font-size:12px">te = (a + 4m + b) / 6 · durations in working days · links finish-to-start with optional lag (B+2)</span></header><div class="bd">
    <div class="tw" data-keep-scroll="sched"><table class="t eg"><thead><tr>${cols.map(([, l, t]) => `<th class="${t === 'n' ? 'n' : ''}">${l}</th>`).join('')}<th class="n">te</th><th class="n">ES</th><th class="n">EF</th><th class="n">LS</th><th class="n">LF</th><th class="n">Float</th><th>Start</th><th>Finish</th><th></th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="18" class="ro"><div class="empty">No activities yet. Add one or load the template.</div></td></tr>`}</tbody></table></div>
    <div class="row"><button class="btn" data-act="rowAdd" data-sheet="schedule">+ Add activity</button><span class="faint" style="font-size:12px">Leave a and b blank for a deterministic duration. Budget / weight drives the planned S-curve; if all are blank, durations are used.</span></div>
  </div></section>`;
};
ACT.loadSchedTpl = () => editSheet('schedule', s => { s.activities = deepClone(TPL_SCHED).map(a => ({ ...a, id: uid('a') })); });
ACT.saveBaseline = () => { const p = projectOf(S.open.pid), c = cpm(S.open.sheets.schedule, p); if (!c.ok) return toast('Fix the schedule errors first.'); editSheet('schedule', s => { s.baseline = { savedAt: new Date().toISOString(), rows: Object.fromEntries(c.acts.map(a => [a.id, { sd: a.sd, fd: a.fd, ES: a.ES, EF: a.EF }])) }; }); toast('Schedule baseline saved.'); };

/* ---------- Gantt ---------- */
PTAB.gantt = p => {
  const sh = S.open.sheets.schedule, c = cpm(sh, p), g = S.ui.gantt || (S.ui.gantt = { px: 0, flt: true, base: true, crit: false, links: true, prog: true });
  if (!c.ok || !c.acts.length) return `<div class="empty">${c.errors.length ? esc(c.errors[0]) : 'Add activities in PERT / CPM first.'}</div>`;
  const acts = c.acts.filter(a => !g.crit || a.crit).sort((a, b) => a.ES - b.ES || a.code.localeCompare(b.code));
  const t0 = dOf(c.start), end = dOf(c.at(Math.ceil(c.D) + 5));
  if (sh.baseline) Object.values(sh.baseline.rows).forEach(r => { const f = dOf(r.fd); if (f > end) end.setTime(f.getTime()); });
  const days = Math.max(7, Math.round((end - t0) / 864e5) + 2), LW = 250, RH = 26, HH = 40;
  const avail = Math.max(400, (($('#main')?.clientWidth || 1100) - 40) - LW), px = g.px || clamp(Math.floor(avail / days), 4, 28);
  const W = LW + days * px, H = HH + acts.length * RH + 8;
  const X = iso => LW + Math.round((dOf(iso) - t0) / 864e5) * px;
  let s = `<rect x="0" y="0" width="${W}" height="${H}" fill="var(--surface)"/>`;
  for (let i = 0; i < days; i++) { const d = new Date(t0.getTime() + i * 864e5), x = LW + i * px; if (d.getDate() === 1 || i === 0) s += `<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="var(--rule-strong)"/><text x="${x + 4}" y="14" font-size="11" fill="var(--ink)" font-family="Space Grotesk, sans-serif">${MONL[d.getMonth()]} ${d.getFullYear()}</text>`; if (d.getDay() === 0) s += `<rect x="${x}" y="${HH}" width="${px}" height="${H - HH}" fill="var(--sunk)"/>`; if (px >= 12 || d.getDay() === 1) s += `<text x="${x + px / 2}" y="32" text-anchor="middle" font-size="9.5" fill="var(--faint)" ${FONT}>${d.getDate()}</text>`; }
  const tx = X(todayISO()); if (tx > LW && tx < W) s += `<line x1="${tx}" x2="${tx}" y1="${HH}" y2="${H}" stroke="var(--s3)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  const rowY = {}; acts.forEach((a, i) => rowY[a.code] = HH + i * RH);
  acts.forEach((a, i) => {
    const y = HH + i * RH;
    s += `<line x1="0" x2="${W}" y1="${y + RH}" y2="${y + RH}" stroke="var(--rule)"/>`;
    s += `<text x="8" y="${y + 17}" font-size="11.5" fill="var(--muted)" ${FONT}>${esc(a.code)}</text><text x="44" y="${y + 17}" font-size="12" fill="var(--ink)">${esc(String(a.name || '').slice(0, 30))}</text>`;
    const x1 = X(a.sd), x2 = X(a.fd) + px;
    if (g.base && sh.baseline?.rows?.[a.id]) { const bl = sh.baseline.rows[a.id]; s += `<rect x="${X(bl.sd)}" y="${y + 19}" width="${Math.max(3, X(bl.fd) + px - X(bl.sd))}" height="4" rx="2" fill="var(--faint)"><title>Baseline ${fdate(bl.sd)} → ${fdate(bl.fd)}</title></rect>`; }
    if (a.te === 0) { s += `<path d="M${x1} ${y + 6} l7 7 l-7 7 l-7 -7 z" fill="var(--s3)"><title>${esc(a.name)} — milestone ${fdate(a.sd)}</title></path>`; }
    else {
      const col = a.crit ? 'var(--s3)' : 'var(--s2)';
      s += `<rect x="${x1}" y="${y + 5}" width="${Math.max(3, x2 - x1)}" height="13" rx="3" fill="${col}" opacity=".35"/>`;
      if (g.prog) s += `<rect x="${x1}" y="${y + 5}" width="${Math.max(0, (x2 - x1) * clamp(num(a.pct), 0, 100) / 100)}" height="13" rx="3" fill="${col}"/>`;
      s += `<rect x="${x1}" y="${y + 5}" width="${Math.max(3, x2 - x1)}" height="13" rx="3" fill="transparent" stroke="${col}"><title>${esc(a.code)} ${esc(a.name)}\n${fdate(a.sd)} → ${fdate(a.fd)} · ${fmt(a.te, 1)} d · float ${fmt(a.TF, 1)} · ${fmt(num(a.pct), 0)}% done</title></rect>`;
      if (g.flt && a.TF > 1e-6) { const xl = X(a.lfd) + px; s += `<line x1="${x2}" x2="${xl}" y1="${y + 11.5}" y2="${y + 11.5}" stroke="var(--faint)" stroke-dasharray="2 2"/><line x1="${xl}" x2="${xl}" y1="${y + 7}" y2="${y + 16}" stroke="var(--faint)"/>`; }
    }
  });
  if (g.links) acts.forEach(a => a.P.forEach(pr => { if (rowY[pr.code] == null) return; const b = c.byCode[pr.code]; const xa = b.te === 0 ? X(b.sd) : X(b.fd) + px, ya = rowY[pr.code] + 11.5, xb = X(a.sd), yb = rowY[a.code] + 11.5; s += `<path d="M${xa} ${ya} h5 V${yb} H${Math.max(xa + 5, xb - 2)}" fill="none" stroke="var(--rule-strong)" stroke-width="1"/>`; }));
  const opt = (k, l) => `<label class="row" style="gap:6px;font-size:13px"><input type="checkbox" data-gopt="${k}" ${g[k] ? 'checked' : ''} style="accent-color:var(--accent)">${l}</label>`;
  return `<section class="box"><header><h2>Gantt chart</h2><span class="sp"></span><label for="gz" class="muted" style="font-size:12.5px">Zoom</label><input type="range" id="gz" min="4" max="28" value="${px}" data-gopt="px">${opt('flt', 'Float')}${opt('base', 'Baseline')}${opt('prog', '% done')}${opt('links', 'Links')}${opt('crit', 'Critical only')}</header><div class="bd">
  <div class="legend"><span><i style="background:var(--s3)"></i>Critical</span><span><i style="background:var(--s2)"></i>Non-critical</span><span><i class="ln" style="background:var(--faint)"></i>Baseline / float</span><span><i class="ln" style="background:var(--s3)"></i>Today</span></div>
  <div class="gantt-wrap" data-keep-scroll="gantt"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gantt chart">${s}</svg></div></div></section>`;
};

/* ---------- BOQ ---------- */
PTAB.boq = p => {
  const sh = S.open.sheets.boq, b = boqCalc(sh, p);

  let rows = '';
  divs.forEach(dv => {
    const its = b.items.filter(i => (i.div || 'General') === dv);
    rows += `<tr class="grp"><td colspan="11" class="ro">${esc(dv)} <span class="faint num" style="font-weight:400">${money(sum(its, i => i.amt))}</span></td></tr>`;
    its.forEach(it => {
      const inp = (k, cls = '', w = '') => `<input id="boq-${it.id}-${k}" data-sheet="boq" data-row="${it.id}" data-field="${k}" ${cls === 'n' ? 'data-num="1" inputmode="decimal"' : ''} type="text" class="${w}" value="${esc(it[k] ?? '')}" aria-label="${k}">`;

      <td><select id="boq-${it.id}-mode" data-sheet="boq" data-row="${it.id}" data-field="mode" aria-label="Rate basis"><option value="build"${it.mode !== 'manual' ? ' selected' : ''}>Build-up</option><option value="manual"${it.mode === 'manual' ? ' selected' : ''}>Manual rate</option></select></td>
      <td class="n">${it.mode === 'manual' ? inp('rate', 'n') : `<button class="btn sm" data-act="editRes" data-row="${it.id}" title="Edit material, labour and equipment lines">${(it.res || []).length} lines · ${fmt(it.c.direct, 2)}</button>`}</td>
      <td class="n ro">${fmt(it.up, 2)}</td><td class="n ro">${fmt(it.amt, 2)}</td><td class="x"><button data-act="rowDel" data-sheet="boq" data-row="${it.id}" aria-label="Delete item">×</button></td></tr>`;
    });
  });
  const mk = b.mk;
  const recOpts = RECIPES.map(r => `<option value="${r.k}">${esc(r.desc)} (${r.unit})</option>`).join('');
  return `<div class="grid2" style="margin-bottom:14px">
  <section class="box"><header><h2>Project cost</h2></header><div class="bd">
    <div class="kpis"><div class="kpi"><div class="l">Direct cost</div><div class="v">${moneyK(b.direct)}</div></div><div class="kpi"><div class="l">Contract estimate</div><div class="v">${moneyK(b.total)}</div><div class="s">vs contract ${moneyK(num(p.contract) + num(p.vo))}</div></div></div>
    <div class="fields">${['ocm', 'profit', 'vat'].map(k => `<div class="f"><label for="boqmk-${k}">${{ ocm: 'OCM / overhead %', profit: 'Profit %', vat: 'VAT %' }[k]}</label><input id="boqmk-${k}" data-sheet="boq" data-field="${k}" data-num="1" inputmode="decimal" value="${esc(mk[k])}"></div>`).join('')}</div>
  </div></section>
  <section class="box"><header><h2>Material, labour & equipment cost</h2></header><div class="bd">${partsBar([{ name: 'Materials', color: 'var(--s1)', val: b.cat.M }, { name: 'Labour', color: 'var(--s2)', val: b.cat.L }, { name: 'Equipment', color: 'var(--s3)', val: b.cat.E }, { name: 'Lump sum', color: 'var(--faint)', val: b.cat.O }])}
    <div class="tw"><table class="t"><tbody><tr><td>Direct cost</td><td class="n">${money(b.direct)}</td></tr><tr><td>OCM ${fmt(num(mk.ocm), 1)}%</td><td class="n">${money(b.ocm)}</td></tr><tr><td>Profit ${fmt(num(mk.profit), 1)}%</td><td class="n">${money(b.profit)}</td></tr><tr><td>VAT ${fmt(num(mk.vat), 1)}%</td><td class="n">${money(b.vat)}</td></tr><tr class="tot"><td>Total</td><td class="n">${money(b.total)}</td></tr></tbody></table></div></div></section></div>

  </div></section>`;
};
ACT.addRecipe = () => { const r = RECIPES.find(x => x.k === $('#recipe').value); const x = recipeItem(r, 1); editSheet('boq', s => { x.item.no = String(s.items.length + 1); s.items.push(x.item); }); if (x.miss.length) toast('Not in your library: ' + x.miss.join(', ')); };
ACT.lockBaseline = () => { const sh = S.open.sheets.boq, p = projectOf(S.open.pid), b = boqCalc(sh, p); const prices = {}; sh.items.forEach(it => (it.res || []).forEach(x => prices[x.ref] = libPrice(x.t, x.ref))); editSheet('boq', s => { s.baseline = { savedAt: new Date().toISOString(), prices, rates: Object.fromEntries(b.items.map(i => [i.id, i.up])), total: b.total, direct: b.direct }; }); toast('Price baseline locked. Price changes will show against it.'); };
ACT.editRes = el => {

    root.querySelector('#reslines').innerHTML = lines.map((x, i) => `<tr><td><select data-i="${i}" data-k="t">${['m', 'l', 'e'].map(t => `<option value="${t}"${x.t === t ? ' selected' : ''}>${RES_T[t][1]}</option>`).join('')}</select></td><td><select data-i="${i}" data-k="ref" style="min-width:220px"><option value="">— pick —</option>${opts(x.t).replace(`value="${x.ref}"`, `value="${x.ref}" selected`)}</select></td><td class="n"><input data-i="${i}" data-k="q" value="${esc(x.q)}" inputmode="decimal"></td><td class="n"><input data-i="${i}" data-k="w" value="${esc(x.w)}" inputmode="decimal"></td><td class="n ro">${fmt(num(x.q) * (1 + num(x.w) / 100) * libPrice(x.t, x.ref), 2)}</td><td class="x"><button data-del="${i}" aria-label="Remove line">×</button></td></tr>`).join('') || '<tr><td colspan="6" class="ro"><div class="empty">No lines. Add materials, labour or equipment.</div></td></tr>';
    const tot = sum(lines, x => num(x.q) * (1 + num(x.w) / 100) * libPrice(x.t, x.ref));
    root.querySelector('#restot').textContent = money(tot) + ' per ' + (it.unit || 'unit');
  };
  openModal({ title: `Cost build-up — ${it.desc || 'item'}`, wide: true, body: `<p class="muted" style="margin:0;font-size:13px">Quantities are per 1 ${esc(it.unit || 'unit')} of the BOQ item. Prices come from the database, so later price changes update this rate automatically.</p><div class="tw"><table class="t eg"><thead><tr><th>Type</th><th>Resource</th><th class="n">Qty per unit</th><th class="n">Waste %</th><th class="n">Cost</th><th></th></tr></thead><tbody id="reslines"></tbody></table></div><div class="row"><button class="btn" id="resadd">+ Add line</button><span style="flex:1"></span><b>Direct unit cost: <span id="restot" class="num"></span></b></div>`,
    onOpen: root => {
      draw(root);
      root.addEventListener('change', e => { const i = e.target.dataset.i, k = e.target.dataset.k; if (i == null) return; lines[i][k] = k === 'q' || k === 'w' ? num(e.target.value) : e.target.value; if (k === 't') lines[i].ref = ''; draw(root); });

    },
    onSave: () => { editSheet('boq', s => { const x = s.items.find(i => i.id === it.id); x.res = lines.filter(l => l.ref); }); } });
};

/* ---------- BOM ---------- */
PTAB.bom = p => {
  const sh = S.open.sheets.boq, bom = bomCalc(sh);
  const onOrder = ref => sum(S.orders.filter(o => o.materialId === ref && o.projectId === p.id && o.status !== 'Completed'), o => o.qty);
  const mrows = bom.M.map(r => { const stock = num(r.li?.stock), oo = onOrder(r.ref), short = Math.max(0, r.qty - stock - oo); return `<tr><td>${esc(r.name)}</td><td>${esc(r.unit)}</td><td class="n">${fmt(r.qty, 2)}</td><td class="n">${fmt(r.price, 2)}</td><td class="n">${fmt(r.amt, 2)}</td><td class="n">${fmt(stock, 0)}</td><td class="n">${fmt(oo, 0)}</td><td class="n">${short > 0 ? `<span class="chip warn">${fmt(short, 1)}</span>` : '<span class="chip ok">0</span>'}</td><td>${availChip(r.li?.avail)}</td><td class="n">${r.base != null ? fmt(r.base, 2) : '—'}</td><td class="n">${r.base != null ? `<span class="chip ${r.price > r.base ? 'bad' : r.price < r.base ? 'ok' : ''}">${r.price >= r.base ? '+' : ''}${fmt(r.dAmt, 2)}</span>` : '—'}</td><td class="acts">${short > 0 ? `<button class="btn sm" data-act="bomPR" data-ref="${r.ref}" data-qty="${short}">Request</button>` : ''}</td></tr>`; }).join('');
  const simple = (list, u) => list.map(r => `<tr><td>${esc(r.name)}</td><td class="n">${fmt(r.qty, 2)}</td><td>${esc(r.unit || u)}</td><td class="n">${fmt(r.price, 2)}</td><td class="n">${fmt(r.amt, 2)}</td></tr>`).join('');
  const shortCount = bom.M.filter(r => r.qty - num(r.li?.stock) - onOrder(r.ref) > 0).length;
  return `<div class="kpis" style="margin-bottom:14px"><div class="kpi"><div class="l">Materials</div><div class="v">${moneyK(sum(bom.M, r => r.amt))}</div><div class="s">${bom.M.length} items</div></div><div class="kpi"><div class="l">Labour</div><div class="v">${fmt(sum(bom.L, r => r.qty), 1)}<small>man-days</small></div><div class="s">${moneyK(sum(bom.L, r => r.amt))}</div></div><div class="kpi"><div class="l">Equipment</div><div class="v">${fmt(sum(bom.E, r => r.qty), 1)}<small>unit-days</small></div><div class="s">${moneyK(sum(bom.E, r => r.amt))}</div></div><div class="kpi"><div class="l">Price change vs baseline</div><div class="v">${sh.baseline ? (bom.impact >= 0 ? '+' : '') + moneyK(bom.impact) : '—'}</div><div class="s">${sh.baseline ? 'since ' + fdate(sh.baseline.savedAt.slice(0, 10)) : 'Lock a baseline in the BOQ tab'}</div></div></div>
  <section class="box" style="margin-bottom:14px"><header><h2>Bill of materials</h2><span class="sp"></span>${shortCount ? `<button class="btn pri" data-act="bomPRall">Request all shortfalls (${shortCount})</button>` : ''}</header><div class="bd"><div class="tw"><table class="t"><thead><tr><th>Material</th><th>Unit</th><th class="n">Qty incl. waste</th><th class="n">Unit price</th><th class="n">Amount</th><th class="n">In stock</th><th class="n">On order</th><th class="n">Shortfall</th><th>Availability</th><th class="n">Baseline price</th><th class="n">Cost change</th><th></th></tr></thead><tbody>${mrows || '<tr><td colspan="12"><div class="empty">No materials yet. Add build-up items in the BOQ.</div></td></tr>'}${bom.M.length ? `<tr class="tot"><td colspan="4">Total materials</td><td class="n">${money(sum(bom.M, r => r.amt))}</td><td colspan="5"></td><td class="n">${sh.baseline ? money(sum(bom.M, r => r.dAmt)) : ''}</td><td></td></tr>` : ''}</tbody></table></div>
  <p class="faint" style="margin:0;font-size:12px">Prices update automatically when you change them in the material database. Stock and on-order quantities come from the database and procurement orders for this project.</p></div></section>
  <div class="grid2"><section class="box"><header><h2>Labour</h2></header><div class="bd"><div class="tw"><table class="t"><thead><tr><th>Trade</th><th class="n">Man-days</th><th>Unit</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead><tbody>${simple(bom.L, 'day') || '<tr><td colspan="5"><div class="empty">No labour lines.</div></td></tr>'}</tbody></table></div></div></section>
  <section class="box"><header><h2>Equipment</h2></header><div class="bd"><div class="tw"><table class="t"><thead><tr><th>Equipment</th><th class="n">Qty</th><th>Unit</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead><tbody>${simple(bom.E, 'day') || '<tr><td colspan="5"><div class="empty">No equipment lines.</div></td></tr>'}</tbody></table></div></div></section></div>`;
};
async function createPR(ref, qty, p) {
  const m = S.materials.find(x => x.id === ref); if (!m) return;
  const n = S.orders.length + 1;
  return saveItem('orders', { no: 'PR-' + String(n).padStart(4, '0'), projectId: p.id, materialId: ref, desc: m.name, qty: Math.ceil(qty * 100) / 100, unit: m.unit, price: num(m.price), supplierId: m.supplierId || '', needBy: '', status: 'Requested', requested: todayISO(), notes: 'From BOM shortfall' });
}
ACT.bomPR = async el => { const p = projectOf(S.open.pid); if (await createPR(el.dataset.ref, num(el.dataset.qty), p)) toast('Purchase request created in Procurement.'); };
ACT.bomPRall = async () => { const p = projectOf(S.open.pid), bom = bomCalc(S.open.sheets.boq); let n = 0; for (const r of bom.M) { const oo = sum(S.orders.filter(o => o.materialId === r.ref && o.projectId === p.id && o.status !== 'Completed'), o => o.qty); const sh = r.qty - num(r.li?.stock) - oo; if (sh > 0 && await createPR(r.ref, sh, p)) n++; } toast(`${n} purchase requests created.`); };

/* ---------- Billing ---------- */

  <section class="box"><header><h2>Billing management</h2><span class="sp"></span><span class="faint" style="font-size:12px">Terms: advance ${fmt(num(b.P.dp), 1)}% · retention ${fmt(num(b.P.ret), 1)}% · EWT ${fmt(num(b.P.ewt), 1)}% · final VAT ${fmt(num(b.P.fvat), 1)}% · ${b.P.vatInc ? 'VAT-inclusive' : 'VAT-exclusive'}</span><button class="btn sm" data-act="editProject">Edit terms</button></header><div class="bd">

    <div class="row"><button class="btn pri" data-act="addBilling">+ New billing at ${pct(e.actual, 2)} actual</button><span class="faint" style="font-size:12px">Cumulative % defaults to the actual accomplishment from the schedule. Amount paid defaults to net due when marked Paid.</span></div>

ACT.addBilling = () => { const p = projectOf(S.open.pid), c = cpm(S.open.sheets.schedule, p); const n = S.open.sheets.billing.items.length + 1; editSheet('billing', s => s.items.push({ id: uid('b'), no: 'PB-' + String(n).padStart(2, '0'), date: todayISO(), cum: Math.round(actualPct(c) * 100) / 100, status: 'Draft', paidDate: '', paid: '', notes: '' })); };

/* ---------- Plan vs actual ---------- */
PTAB.pva = p => {
  const sh = S.open.sheets, c = cpm(sh.schedule, p), b = boqCalc(sh.boq, p), bill = billingCalc(sh.billing, p), e = evmCalc(c, b, sh.costs, bill, p);
  const recs = (sh.progress.records || []).slice().sort((x, y) => String(x.date).localeCompare(y.date));
  const curve = plannedCurve(c);
  const inp = (sheet, r, k, n, type = 'text', w = '') => `<input id="${sheet}-${r.id}-${k}" data-sheet="${sheet}" data-row="${r.id}" data-field="${k}" ${n ? 'data-num="1" inputmode="decimal"' : ''} type="${type}" class="${w}" value="${esc(r[k] ?? '')}" aria-label="${k}">`;
  const precs = recs.map(r => `<tr><td>${inp('progress', r, 'date', 0, 'date')}</td><td class="n ro">${fmt(plannedOn(c, r.date), 2)}</td><td class="n">${inp('progress', r, 'actual', 1)}</td><td class="n">${inp('progress', r, 'cost', 1)}</td><td>${inp('progress', r, 'note', 0, 'text', 'w')}</td><td class="x"><button data-act="rowDel" data-sheet="progress" data-row="${r.id}" aria-label="Delete record">×</button></td></tr>`).join('');
  const cats = ['Material', 'Labour', 'Equipment', 'Subcontract', 'Overhead'];
  const costs = (sh.costs.entries || []).slice().sort((x, y) => String(y.date).localeCompare(x.date));
  const crow = costs.map(r => `<tr><td>${inp('costs', r, 'date', 0, 'date')}</td><td><select id="costs-${r.id}-cat" data-sheet="costs" data-row="${r.id}" data-field="cat" aria-label="Category">${cats.map(x => `<option${x === r.cat ? ' selected' : ''}>${x}</option>`).join('')}</select></td><td>${inp('costs', r, 'desc', 0, 'text', 'w')}</td><td>${inp('costs', r, 'ref')}</td><td class="n">${inp('costs', r, 'amount', 1)}</td><td class="x"><button data-act="rowDel" data-sheet="costs" data-row="${r.id}" aria-label="Delete cost">×</button></td></tr>`).join('');

  return `<div class="kpis" style="margin-bottom:14px">

    <div class="kpi"><div class="l">Actual</div><div class="v">${pct(e.actual)}</div><div class="s"><span class="chip ${e.slip < -10 ? 'bad' : e.slip < -5 ? 'warn' : 'ok'}">${e.slip >= 0 ? '+' : ''}${fmt(e.slip, 1)}% slippage</span></div></div>
    <div class="kpi"><div class="l">SPI / CPI</div><div class="v">${e.SPI ? fmt(e.SPI, 2) : '—'} / ${e.CPI ? fmt(e.CPI, 2) : '—'}</div><div class="s">EV ${moneyK(e.EV)} · AC ${moneyK(e.AC)}</div></div>
    <div class="kpi"><div class="l">Estimate at completion</div><div class="v">${moneyK(e.EAC)}</div><div class="s">budget ${moneyK(e.BAC)} · to go ${moneyK(e.ETC)}</div></div>
    <div class="kpi"><div class="l">Projected margin</div><div class="v">${moneyK(e.margin)}</div><div class="s">${pct(e.marginPct)} of revenue ex-VAT</div></div></div>
  <div class="grid2" style="margin-bottom:14px">
    <section class="box"><header><h2>S-curve</h2></header><div class="bd">${lineChartDates({ aria: 'Planned and actual cumulative progress', ymax: 100, today: todayISO(), yfmt: v => fmt(v, 0) + '%', series: [{ name: 'Planned (schedule)', color: 'var(--s1)', pts: curve }, { name: 'Actual (recorded)', color: 'var(--s3)', pts: recs.map(r => ({ x: r.date, y: num(r.actual) })), marker: true }] })}</div></section>
    <section class="box"><header><h2>Remaining progress bill & contract cost</h2><span class="sp"></span><button class="btn sm" data-act="ptab" data-tab="billing">Billing management →</button></header><div class="bd"><div class="tw"><table class="t"><tbody>
      <tr><td>Revised contract amount</td><td class="n">${money(bill.rev)}</td></tr><tr><td>Billed to date (gross, ${pct(bill.lastCum)})</td><td class="n">${money(bill.grossCum)}</td></tr><tr><td>Remaining to bill</td><td class="n"><b>${money(bill.remaining)}</b></td></tr>
      <tr><td>Earned but not yet billed (${pct(e.nextBillPct)})</td><td class="n">${money(e.nextBillGross)}</td></tr><tr><td>Retention held</td><td class="n">${money(bill.retention)}</td></tr><tr><td>Collected / receivable</td><td class="n">${money(bill.collected)} / ${money(bill.receivable)}</td></tr>
      <tr><td>Actual cost to date</td><td class="n">${money(e.AC)}</td></tr><tr><td>Cost to complete (at current CPI)</td><td class="n">${money(e.ETC)}</td></tr><tr class="tot"><td>Projected margin</td><td class="n">${money(e.margin)}</td></tr></tbody></table></div></div></section></div>

function calEvents() {
  const ev = [];
  const hol = holidayMap();
  Object.entries(hol).forEach(([d, h]) => ev.push({ d, t: h.title, k: 'h', type: 'Holiday', sub: h.kind }));
  S.events.filter(e => e.type !== 'Holiday').forEach(e => ev.push({ d: e.date, t: e.title, k: e.type === 'Due date' ? 'd' : e.type === 'Report' ? 'r' : 'e', type: e.type, id: e.id, pid: e.projectId }));
  S.projects.forEach(p => {
    const x = p.summary || {};
    if (p.start) ev.push({ d: p.start, t: `${p.name} — start`, k: 'p', type: 'Project', pid: p.id });
    if (p.targetEnd) ev.push({ d: p.targetEnd, t: `${p.name} — target completion`, k: 'd', type: 'Due date', pid: p.id });
    (x.milestones || []).forEach(m => ev.push({ d: m.d, t: `${p.name} — ${m.t}`, k: 'p', type: 'Milestone', pid: p.id }));
    (x.bills || []).forEach(b => b.d && ev.push({ d: b.d, t: `${p.name} — billing ${b.no || ''} (${b.s})`, k: 'r', type: 'Report', pid: p.id }));
  });
  S.orders.filter(o => o.needBy && o.status !== 'Completed').forEach(o => ev.push({ d: o.needBy, t: `Needed on site: ${o.desc} (${o.no})`, k: 'd', type: 'Due date', pid: o.projectId }));
  S.todos.filter(t => t.due && !t.done).forEach(t => ev.push({ d: t.due, t: `To do: ${t.text}`, k: 'd', type: 'To do' }));
  const f = S.settings.dashProject;
  return f && f !== 'all' ? ev.filter(e => !e.pid || e.pid === f || e.k === 'h') : ev;
}

  return doc.output('blob');
}

function rnAll() {
  const mine = S.refs.map(r => ({ id: r.id, codes: [r.code], clause: r.clause, title: r.title, topic: r.topic || '', text: r.text || r.notes || '', url: r.url, builtin: false }));
  return [...mine, ...REF_NOTES.map((n, i) => ({ ...n, id: 'b' + i }))];
}
function hiText(s, q) {
  const t = esc(s); if (!q) return t;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '|') + ')', 'ig');
  return t.replace(re, '<mark>$1</mark>');
}

async function importBackup(file) {

}

function tickClock() {
  const now = new Date(), tz = S.settings.tz || undefined;
  let t = now.toLocaleTimeString(), tShort = t, d = now.toDateString();
  try {
    t = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: !S.settings.clock24 }).format(now);
    tShort = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit', hour12: !S.settings.clock24 }).format(now);
    d = new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }).format(now);
  } catch (e) { }
  $$('.clock').forEach(el => { el.querySelector('.t').textContent = t; el.querySelector('.d').textContent = d; el.querySelector('.z').textContent = `${tzOffset(tz)} · ${(tz || '').replace(/_/g, ' ')}`; });
  const mc = $('#mclock'); if (mc) mc.textContent = tShort;
}

function fbErrText(e) {
  const c = e && e.code || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Email or password is incorrect.';
  if (/invalid-email/.test(c)) return 'That email address is not valid.';
  if (/too-many-requests/.test(c)) return 'Too many attempts. Wait a few minutes, or reset your password.';
  if (/network-request-failed/.test(c)) return 'No internet connection. Check your connection and try again.';
  if (/user-disabled/.test(c)) return 'This account has been disabled.';
  if (/permission-denied/.test(c)) return 'Your account is not on the team list in firestore.rules.';
  return (e && e.message) || 'Sign-in failed.';
}

const ICONS = {

  new: '<path d="M12 5v14M5 12h14"/>',
  open: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  tools: '<path d="M4 20h16M6 16l4-4 3 3 5-6"/><circle cx="18" cy="6" r="2"/>',
  more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
};
const ico = k => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
const RAIL = [['refs', 'References', 'NSCP, AISC, ACI, ASTM, Brunei EC…'], ['library', 'Material, Labour, Equipment Database', ''], ['procurement', 'Procurement Database', ''], ['settings', 'Settings', '']];
function buildShell() {
  $('#app').innerHTML = `<header class="top"><div class="top-in">
    <div class="brand">${LOGO(28)}<span class="bt">DARKWIZ <span>CT</span></span></div>
    <nav class="nav" aria-label="Main">${[['dashboard', 'Dashboard / Home'], ['new', 'Create a new project'], ['open', 'Open existing project'], ['tools', 'Quick tools']].map(([k, l]) => `<button data-act="go" data-page="${k}" data-go="${k}">${l}</button>`).join('')}</nav>
    <div class="me"><span id="mclock" class="mclock num"></span><span class="mode ${S.mode === 'local' ? 'local' : 'cloud'}" title="${S.mode === 'local' ? 'Data is saved in this browser only' : 'Data is saved to the cloud database'}">${S.mode === 'local' ? 'Offline' : 'Cloud'}</span><img src="${esc(S.me.avatarUrl || '')}" alt="" ${S.me.avatarUrl ? '' : 'hidden'}><span class="nm">${esc(S.me.email || S.settings.displayName || S.me.name || '')}</span><button class="verchip" data-act="changelog" title="What's new in this version">${verText()}</button></div>
  </div></header>
  <div class="shell"><main id="main"></main>
    <aside class="rail" aria-label="Tools">
      <div class="clock" role="timer" aria-live="off"><div class="t">--:--</div><div class="d"></div><div class="z"></div></div>
      ${RAIL.map(([k, l, s]) => `<button class="rbtn" data-act="go" data-page="${k}" data-go="${k}">${l}${s ? `<span class="faint" style="font-weight:400;font-size:11.5px;display:block">${s}</span>` : ''}</button>`).join('')}
    </aside>
    <footer class="appfoot"><span>${APP.fullName} <button class="linkbtn num" data-act="changelog">${verText()}</button> · <button class="linkbtn" data-act="changelog">Changelog</button></span><span>A DARKWIZ Lab app · ${SITE()}</span></footer>
  </div>
  <nav class="bnav" aria-label="Main">${[['dashboard', 'home', 'Home'], ['new', 'new', 'New'], ['open', 'open', 'Projects'], ['tools', 'tools', 'Tools']].map(([k, i, l]) => `<button data-act="go" data-page="${k}" data-go="${k}">${ico(i)}<span>${l}</span></button>`).join('')}<button data-act="moreSheet" data-go="more">${ico('more')}<span>More</span></button></nav>`;
  tickClock();
}
ACT.moreSheet = () => openModal({ title: 'More', noSave: true, sheet: true, body: `<div class="clock" role="timer"><div class="t">--:--</div><div class="d"></div><div class="z"></div></div><div style="display:grid;gap:8px">${RAIL.map(([k, l, s]) => `<button class="btn" style="justify-content:flex-start;padding:12px 14px;text-align:left" data-more="${k}"><span><b>${l}</b>${s ? `<span class="faint" style="display:block;font-size:12px;font-weight:400">${s}</span>` : ''}</span></button>`).join('')}</div>`, onOpen: root => { tickClock(); root.addEventListener('click', e => { const b = e.target.closest('[data-more]'); if (b) { closeModal(); go(b.dataset.more); } }); } });
function enter() {
  S.entered = true;
  buildShell();
  const h = (location.hash || '').slice(1).split('.');
  const page = VIEWS[h[0]] ? h[0] : 'dashboard';
  go(page, h[1] || '', h[2] || '');
}
ACT.lock = () => { S.entered = false; closeProject(); if (S.mode === 'firebase') S.fbAuth.signOut(); else renderGate(); };
ACT.go = el => go(el.dataset.page, el.dataset.a || '', el.dataset.b || '');

/* ================= data subscriptions ================= */
const COLS = ['projects', 'materials', 'labour', 'equipment', 'suppliers', 'orders', 'events', 'refs', 'quotes'];
function unsubscribeAll() { (S.unsubs || []).forEach(u => { try { u(); } catch (e) { } }); S.unsubs = []; }
function subscribeAll() {
  unsubscribeAll();
  const U = S.unsubs = [];
  COLS.forEach(c => U.push(S.db.collection(c).onSnapshot(snap => {
    const prev = Object.fromEntries(S[c].map(x => [x.id, x]));
    S[c] = snap.docs.map(d => { const q = WQ[`${c}/${d.id}`]; if (q && (q.pending || q.running) && prev[d.id]) return prev[d.id]; return { id: d.id, ...d.data() }; });
    S.loaded[c] = true; scheduleRender();
  }, err => { console.error(c, err); if (err?.code !== 'unavailable') toast(S.mode === 'firebase' ? fbErrText(err) : dbErrText(err)); })));
  const priv = (k, apply) => {
    if (!S.privPath) { const v = localLoad(k); if (v) apply(v); return; }
    U.push(S.db.doc(S.privPath(k)).onSnapshot(snap => { const q = WQ[S.privPath(k)]; if (q && (q.pending || q.running)) return; if (snap.exists) apply(snap.data()); scheduleRender(); }, err => console.error(k, err)));
  };
  priv('profile', v => { S.settings = { ...deepClone(DEFAULT_SETTINGS), ...deepClone(v), defaults: { ...DEFAULT_SETTINGS.defaults, ...(v.defaults || {}) }, rates: { ...DEFAULT_SETTINGS.rates, ...(v.rates || {}) } }; localSave('profile', { theme: S.settings.theme }); applyTheme(); tickClock(); });
  priv('todos', v => S.todos = deepClone(v.items || v || []));
  priv('notes', v => S.notes = deepClone(v.items || v || []));
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.closest('.scrim')) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A') e.preventDefault();
  f(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'todonew') { e.preventDefault(); ACT.todoAdd(); return; }
  if (e.key === 'Enter' && e.target.matches('.eg input')) { e.preventDefault(); e.target.blur(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
function uiInput(el, live) {
  const d = el.dataset;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  if (d.ui != null && d.ui !== '') { S.ui[d.ui] = val; scheduleRender(true); return true; }
  if (d.qe) { S.ui.qe[d.qe] = val; scheduleRender(true); return true; }
  if (d.cu) { S.ui.cu[d.cu] = val; scheduleRender(true); return true; }
  if (d.co) { S.ui.co[d.co] = val; scheduleRender(true); return true; }
  if (d.rn) { onRnChange(el); return true; }
  if (d.gopt) { S.ui.gantt[d.gopt] = el.type === 'checkbox' ? el.checked : num(el.value); scheduleRender(true); return true; }
  return false;
}
document.addEventListener('input', e => { const el = e.target; if (!$('#main')?.contains(el)) return; if (el.dataset.qt) return; if (el.tagName === 'INPUT' && el.type !== 'checkbox' && !el.dataset.sheet && !el.dataset.set) uiInput(el, true); });
document.addEventListener('change', e => {
  const el = e.target; if (!$('#main')?.contains(el)) return;
  if (el.id === 'importfile' && el.files[0]) { importBackup(el.files[0]); el.value = ''; return; }
  if (el.dataset.qt) { onQuoteChange(el); return; }
  if (el.dataset.sheet) { onSheetChange(el); return; }
  if (el.dataset.set) { let v = el.value; if (el.dataset.num) v = num(v); if (el.dataset.set === 'clock24') v = v === 'true'; setSetting(el.dataset.set, v); return; }
  if (el.dataset.act) return;
  uiInput(el, false);
});

/* ================= boot ================= */
function loadScript(src) {
  return new Promise((res, rej) => { if ($$('script').some(s => s.src === src)) return res(); const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); });
}
const FB_VER = '10.14.1';
async function initFirebase(cfg) {
  if (!window.firebase) {
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
    await Promise.all([loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-auth-compat.js`), loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore-compat.js`)]);
  }
  if (!firebase.apps.length) firebase.initializeApp(cfg);
  const fs = firebase.firestore();
  try { await fs.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* another tab or unsupported browser: online-only */ }
  return { auth: firebase.auth(), fs };
}
function firebaseConfig() {
  const c = window.DWQS_FIREBASE;
  return c && c.apiKey && c.projectId && !/PASTE|YOUR_/i.test(c.apiKey + c.projectId) ? c : null;
}
async function boot() {
  const saved = localLoad('profile'); if (saved?.theme) S.settings.theme = saved.theme;
  applyTheme();
  renderGate('connecting');
  const inClaude = !!(window.claude && typeof window.claude.use === 'function');
  if (inClaude) {
    const use = n => window.claude.use(n).catch(() => null);
    const [db, user, assets, downloads] = await Promise.all([use('db'), use('user'), use('assets'), use('downloads')]);
    if (db) {
      S.mode = 'claude'; S.db = db; S.user = user; S.assets = assets; S.downloads = downloads;
      const id = user ? await user.id() : null;
      S.uid = id;
      if (id) S.privPath = k => `data/users/${id}/${k}`;
      if (user) { try { S.me = await user.me(); } catch (e) { } const cw = await user.can('data.write').catch(() => null); S.canWrite = cw !== false; }
      subscribeAll(); renderGate(); return;
    }
    S.downloads = downloads;
  }
  const cfg = !inClaude && firebaseConfig();
  if (cfg) {
    try {
      const { auth, fs } = await initFirebase(cfg);
      S.mode = 'firebase'; S.db = fs; S.fbAuth = auth;
      auth.onAuthStateChanged(u => {
        if (u) {
          S.uid = u.uid; S.privPath = k => `data/users/${u.uid}/${k}`;
          S.me = { name: u.displayName || u.email || '', avatarUrl: u.photoURL || '', email: u.email || '' };
          subscribeAll();
          if (!S.entered) renderGate();
        } else {
          unsubscribeAll(); closeProject(); S.entered = false;
          COLS.forEach(c => { S[c] = []; S.loaded[c] = false; }); S.todos = []; S.notes = [];
          renderGate('signin');
        }
      });
      return;
    } catch (e) { console.error(e); S.bootMsg = "Couldn't reach the online database, so this session saves to this device only. Check your internet connection and reload."; }
  }
  S.mode = 'local'; S.db = makeLocalDB(); S.uid = 'local'; S.privPath = k => `data/users/local/${k}`;
  subscribeAll();
  renderGate();
}
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.claude && document.querySelector('link[rel="manifest"]')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
}

</script>
</body>
</html>
